[build]
builder = "NIXPACKS"
buildCommand = "COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction && npm ci && npm run build"

[deploy]
startCommand = "sh scripts/railway-start.sh"
healthcheckPath = "/up"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
